<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#151f32"/>
    </linearGradient>
    <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- 背景角丸スクエア -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#26354a" stroke-width="4"/>

  <!-- 同心円の電波波紋 -->
  <circle cx="256" cy="240" r="150" fill="none" stroke="rgba(14, 165, 233, 0.15)" stroke-width="2"/>
  <circle cx="256" cy="240" r="100" fill="none" stroke="rgba(14, 165, 233, 0.25)" stroke-width="2"/>

  <!-- 糸（P2P直通ライン） -->
  <path d="M140 240 Q 256 160 372 240" fill="none" stroke="url(#threadGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 10" filter="url(#glow)"/>

  <!-- 端末A（あなた） -->
  <circle cx="140" cy="240" r="46" fill="#0ea5e9" filter="url(#glow)"/>
  <circle cx="140" cy="240" r="38" fill="#151f32"/>
  <text x="140" y="254" font-size="32" text-anchor="middle" fill="#38bdf8">🧵</text>

  <!-- 端末B（相手） -->
  <circle cx="372" cy="240" r="46" fill="#0ea5e9" filter="url(#glow)"/>
  <circle cx="372" cy="240" r="38" fill="#151f32"/>
  <text x="372" y="254" font-size="32" text-anchor="middle" fill="#38bdf8">📞</text>

  <!-- アプリ名ロゴ -->
  <text x="256" y="390" font-family="-apple-system, sans-serif" font-size="46" font-weight="800" text-anchor="middle" fill="#f8fafc" letter-spacing="6">意図電話</text>
  <text x="256" y="425" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#94a3b8" letter-spacing="3">P2P SECRET CALL</text>
</svg>
